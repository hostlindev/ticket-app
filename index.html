<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EBF1F6">
    <meta
      name="description"
      content="Pixi es la plataforma de gestión y seguimiento de tickets de incidencias para equipos de desarrollo."
    >
    <title>Pixi · Gestión de Incidencias</title>
    <script>
      try {
        const saved = localStorage.getItem('pixi_color_palette');
        if (saved) document.documentElement.setAttribute('data-palette', saved);
        else document.documentElement.setAttribute('data-palette', 'celeste');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
